<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Calculadora de distribución de profesores, cursos y líneas para un departamento de instituto."><title>La ronda — Calculadora educativa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="#setup-screen"><span class="brand-mark">L</span><span>LA <span class="brand-dot">RONDA</span></span></a><nav class="main-nav"><span class="step-indicator"><b>01</b> Configuración&nbsp;&nbsp; — &nbsp;&nbsp;<b>02</b> Resumen&nbsp;&nbsp; — &nbsp;&nbsp;<b>03</b> Rondas</span></nav></div></header>
<main><section id="setup-screen" class="calculator-section screen"><div class="container"><div class="calculator-card setup-card"><form id="planning-form"><div class="form-top"><div class="setup-fields"><label for="profesores">Profesores equivalentes<select id="profesores" required><option value="7" selected>7</option></select><small>Admite medias jornadas</small></label><label for="max-horas">Máximo de horas por profesor<select id="max-horas" required><option value="19" selected>19</option></select><small>Capacidad lectiva semanal</small></label></div></div><div class="courses-head"><h2>Cursos, líneas y horas</h2></div><div class="course-labels"><span>Curso</span><span>Líneas</span><span>Horas / línea</span></div><div id="courses-list"></div><button id="add-course" class="button button-light add-course-bottom" type="button">+ Añadir curso</button><button class="button button-dark calculate-button" type="submit">Calcular y ver resumen <span>↗</span></button></form></div></div></section>
<section id="summary-screen" class="calculator-section screen hidden"><div class="container"><div id="results" class="results results-page" aria-live="polite"></div><div class="summary-actions"><button id="back-to-setup" class="button button-light" type="button">← Modificar datos</button><button id="go-to-rounds" class="button button-dark" type="button">Pasar a las rondas <span>↗</span></button></div></div></section>
<section id="rounds-screen" class="calculator-section screen hidden"><div class="container"><div class="available-summary"><div class="available-courses-panel"><div class="available-title"><h2>Cursos y líneas disponibles</h2><button id="show-teachers" class="teachers-button" type="button" aria-label="Ver profesores" title="Ver profesores">👤</button></div><div id="available-courses"></div></div></div><div id="rounds-list"></div><button id="back-to-summary" class="button button-light rounds-back-button" type="button">← Volver al resumen</button></div></section></main>
<div id="teachers-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="teachers-modal-title"><div class="modal-content"><button id="close-teachers" class="modal-close" type="button" aria-label="Cerrar">×</button><h2 id="teachers-modal-title">Horas por profesor</h2><p>Horas asignadas frente al máximo semanal.</p><div id="teacher-hours"></div></div></div>
<footer class="site-footer"><div class="container footer-top"><a class="brand" href="#setup-screen"><span class="brand-mark">L</span><span>LA <span class="brand-dot">RONDA</span></span></a><p>Decisiones educativas con contexto.</p><span>&copy; 2025 La ronda</span></div></footer><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="js/app.js"></script><script src="js/safari-touch.js"></script><script>$(function(){function addShortHour(){ $('.course-hours').each(function(){ if(!$(this).find('option[value="2"]').length) $(this).prepend('<option value="2">2</option>'); }); } addShortHour(); $('#add-course').on('click', function(){ setTimeout(addShortHour, 0); });});</script></body></html>
